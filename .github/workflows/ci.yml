name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TranslationApp.sln

      - name: Build
        run: dotnet build TranslationApp.sln -c Release --no-restore

      - name: Test
        run: dotnet test TranslationApp.sln -c Release --no-build --no-restore

  # 发布链路冒烟：直接调用本地发布脚本，保证 CI 与手工发布走同一条命令和同一组产物门禁。
  # 目的是把「发布时才暴露」的问题（单文件裁剪、原生库嵌入、嵌入模型资源、体积门禁）提前到每次推送。
  publish-smoke:
    runs-on: windows-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish and verify single-file win-x64
        shell: pwsh
        run: ./build/publish.ps1 -OutputDir publish
