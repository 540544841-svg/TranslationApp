name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore TranslationApp.sln

      - name: Build
        run: dotnet build TranslationApp.sln -c Release --no-restore

      - name: Test
        run: dotnet test TranslationApp.sln -c Release --no-build --no-restore
