<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>速译 v3.0 · 翻译小窗</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/base.css">
<link rel="stylesheet" href="assets/pages.css">
</head>
<body class="desktop">
  <button class="js-theme-toggle" aria-label="切换主题"></button>

  <div class="fake-win" style="left:6%;top:10%;width:380px">
    <div style="font-weight:600;margin-bottom:8px">editor.ts — TranslationApp</div>
    <div style="opacity:.75;line-height:1.8">const message = "Serendipity";<br>// Concurrency is hard.</div>
  </div>
  <div class="fake-win" style="right:7%;bottom:12%;width:340px">
    <div style="font-weight:600;margin-bottom:8px">阅读窗口</div>
    <div style="opacity:.75;line-height:1.8">Machine learning models grow larger every year…</div>
  </div>

  <div class="win quick-win mica" id="quickWin">
    <div class="win-bar">
      <span class="brand-mark sm">译</span>
      <div class="lang-pill">
        <div class="select" id="srcSel">
          <button class="select-btn"><span class="select-label">自动</span><span data-icon="chevron"></span></button>
          <div class="menu acrylic" id="srcMenu"></div>
        </div>
        <button class="btn-icon swap-btn js-swap" title="互换语言（Alt+X）" data-icon="swap"></button>
        <div class="select" id="dstSel">
          <button class="select-btn"><span class="select-label">中文</span><span data-icon="chevron"></span></button>
          <div class="menu acrylic" id="dstMenu"></div>
        </div>
      </div>
      <span class="spacer"></span>
      <button class="btn-icon" id="copyBtn" title="复制译文" data-icon="copy"></button>
      <button class="btn-icon star-btn" id="starBtn" title="收藏到生词本" data-icon="star"></button>
      <button class="btn-icon" id="closeBtn" title="关闭（Esc）" data-icon="close"></button>
    </div>

    <textarea class="textarea quick-input js-input" id="input" rows="2"
      placeholder="输入文字，按 Enter 翻译"></textarea>
    <div class="quick-hairline"></div>

    <div class="quick-result">
      <div class="empty js-empty" id="empty" style="padding:20px 8px">
        <div class="t-caption">译文会显示在这里，落定即用</div>
      </div>
      <div id="result" hidden>
        <div class="result-text fade-up js-result-text" id="resultText"></div>
        <div class="engine-row">
          <span class="chip chip-accent js-engine-chip">Bing</span>
          <span class="chip js-demo-chip" hidden>示例数据</span>
          <span class="spacer"></span>
          <button class="btn btn-ghost js-compare-btn" id="compareBtn"><span data-icon="compare"></span>对比</button>
          <button class="btn btn-ghost" id="ttsBtn"><span data-icon="sound"></span>朗读</button>
          <button class="btn btn-ghost" id="pinBtn"><span data-icon="pin"></span>钉图</button>
        </div>
        <div class="compare-cols" id="compare" style="margin-top:12px" hidden>
          <div class="card cc-card">
            <div class="cc-head"><span class="chip chip-accent">Bing</span><span class="t-caption">当前引擎</span></div>
            <div class="t-body js-col1"></div>
          </div>
          <div class="card cc-card">
            <div class="cc-head"><span class="chip">Google</span><span class="t-caption">对比引擎</span></div>
            <div class="t-body js-col2"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="quick-status" id="status">
      <span class="js-status-text">输入文字，按 Enter 翻译</span>
    </div>
  </div>

  <div class="card acrylic demo-console">
    <div class="dc-title">演示控制台 — 直达各状态（真实软件由流程驱动）</div>
    <div class="dc-grid" id="dcGrid">
      <button class="btn btn-sm" data-demo="idle">空态</button>
      <button class="btn btn-sm" data-demo="typing">输入后</button>
      <button class="btn btn-sm" data-demo="loading">加载中</button>
      <button class="btn btn-sm" data-demo="result">结果</button>
      <button class="btn btn-sm" data-demo="fallback">降级</button>
      <button class="btn btn-sm" data-demo="error">错误</button>
      <button class="btn btn-sm" data-demo="compare">对比</button>
    </div>
  </div>

  <script src="assets/icons.js"></script>
  <script src="assets/preview.js"></script>
  <script>
  Preview.initTheme();
  initSelects();

  /* 图标挂载：所有 [data-icon] */
  document.querySelectorAll('[data-icon]').forEach(function (el) {
    el.appendChild(icon(el.getAttribute('data-icon')));
  });

  var LANGS = ['自动', '中文', '英语', '日语', '韩语', '法语', '德语', '俄语'];
  function fillMenu(menu, langs, keep) {
    langs.forEach(function (L) {
      var d = document.createElement('div');
      d.className = 'menu-item';
      d.innerHTML = '<span>' + L + '</span><span class="mi-check"></span>';
      d.querySelector('.mi-check').appendChild(icon('check'));
      d.addEventListener('click', function () {
        menu.closest('.select').querySelector('.select-label').textContent = L;
      });
      menu.appendChild(d);
    });
  }
  fillMenu(document.getElementById('srcMenu'), LANGS);
  fillMenu(document.getElementById('dstMenu'), LANGS.filter(function (l) { return l !== '自动'; }));

  var $ = function (id) { return document.getElementById(id); };
  var input = $('input'), empty = $('empty'), result = $('result'),
      resultText = $('resultText'), statusBar = $('status'),
      chip = document.querySelector('.js-engine-chip'),
      demoChip = document.querySelector('.js-demo-chip'),
      compare = $('compare');

  function setStatus(node) {
    statusBar.innerHTML = '';
    statusBar.appendChild(typeof node === 'string' ? Object.assign(document.createElement('span'), { textContent: node }) : node);
  }
  function sEl(text, cls) {
    var s = document.createElement('span');
    s.textContent = text;
    if (cls) s.className = cls;
    return s;
  }
  function showResult(r) {
    empty.hidden = true; result.hidden = false; compare.hidden = true;
    resultText.classList.remove('fade-up'); void resultText.offsetWidth;
    resultText.classList.add('fade-up');
    resultText.textContent = r.text;
    chip.textContent = r.engine;
    demoChip.hidden = !r.demo;
    if (r.fallback) {
      var note = sEl(r.fallback + ' 连不上，已用 ' + r.engine + ' 重试');
      setStatus(note);
    } else {
      setStatus(sEl('已翻译 · ' + r.engine + ' · Enter 重译 / Ctrl+C 复制', 't-caption'));
    }
  }
  function showError() {
    empty.hidden = false; result.hidden = true;
    var frag = document.createDocumentFragment();
    frag.appendChild(sEl('所有引擎都连不上，检查网络或代理后重试', 'err'));
    var b = document.createElement('button');
    b.className = 'btn btn-sm'; b.textContent = '重试';
    b.style.cssText = 'height:20px;margin-left:8px';
    b.addEventListener('click', run);
    frag.appendChild(b);
    setStatus(frag);
  }
  function loading(label) {
    empty.hidden = true; result.hidden = true;
    var frag = document.createDocumentFragment();
    var ring = document.createElement('span'); ring.className = 'progress-ring';
    frag.appendChild(ring); frag.appendChild(sEl(label || 'Google 翻译中…'));
    setStatus(frag);
  }
  function idle() {
    empty.hidden = false; result.hidden = true; input.value = '';
    setStatus(sEl('输入文字，按 Enter 翻译'));
  }
  function run() {
    var text = input.value.trim() || 'Hello';
    if (!input.value.trim()) input.value = text;
    loading('Google 翻译中…');
    Preview.translate(text).then(showResult);
  }
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); }
  });

  /* 状态直达 */
  var DEMOS = {
    idle: idle,
    typing: function () { input.value = 'Machine learning'; setStatus(sEl('按 Enter 翻译')); },
    loading: function () { loading('Google 翻译中…'); },
    result: function () { showResult({ text: '机器学习', engine: 'Bing' }); },
    fallback: function () { showResult({ text: '并发', engine: 'Bing', fallback: 'Google' }); },
    error: showError,
    compare: function () {
      showResult({ text: '意外发现美好事物的运气', engine: 'Bing' });
      compare.hidden = false;
      document.querySelector('.js-col1').textContent = '意外发现美好事物的运气';
      document.querySelector('.js-col2').textContent = '机缘巧合；意外收获珍宝的运气';
    }
  };
  document.querySelectorAll('#dcGrid [data-demo]').forEach(function (b) {
    b.addEventListener('click', function () { DEMOS[b.getAttribute('data-demo')](); });
  });

  /* 语言互换 */
  document.querySelector('.js-swap').addEventListener('click', function () {
    var a = $('srcSel').querySelector('.select-label'), b = $('dstSel').querySelector('.select-label');
    this.classList.remove('spin'); void this.offsetWidth; this.classList.add('spin');
    if (a.textContent === '自动') { Preview.toast('源语言为「自动」时不参与互换'); return; }
    var t = a.textContent; a.textContent = b.textContent; b.textContent = t;
  });

  /* 动作按钮 */
  $('copyBtn').addEventListener('click', function () { Preview.toast('已复制译文'); });
  $('starBtn').addEventListener('click', function () {
    var lit = this.classList.toggle('lit');
    this.innerHTML = '';
    this.appendChild(icon(lit ? 'starFill' : 'star'));
    Preview.toast(lit ? '已加入生词本' : '已移出');
  });
  $('closeBtn').addEventListener('click', function () { Preview.toast('关闭小窗（Esc）'); });
  $('ttsBtn').addEventListener('click', function () { Preview.toast('朗读译文（演示）'); });
  $('pinBtn').addEventListener('click', function () { location.href = 'pin.html'; });
  $('compareBtn').addEventListener('click', function () { DEMOS.compare(); });
  </script>
</body>
</html>
